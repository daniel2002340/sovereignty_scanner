[project]
name = "soevscan"
version = "0.1.0"
description = "Passive scanner that shows which parties and jurisdictions a domain's digital infrastructure depends on."
readme = "README.md"
authors = [
    { name = "Daniel Franke", email = "d.t.l.franke@gmail.com" }
]
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives in ./soevscan, not ./src/soevscan.
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
